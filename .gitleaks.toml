[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies, local run state, and native build output are outside the publication boundary."
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''^build/''',
  '''^\.turbo/''',
  '''^\.convex/''',
  '''^\.pw/''',
  '''^apps/mobile/\.expo/''',
  '''^apps/desktop/src-tauri/target/''',
]

[[allowlists]]
description = "The historical synthetic publication check used a public Clerk test publishable key."
condition = "AND"
regexTarget = "line"
regexes = ['''VITE_CLERK_PUBLISHABLE_KEY=pk_test_''']
paths = ['''^scripts/verify-web-artifact\.sh$''']

[[rules]]
id = "curl-auth-user"

  [[rules.allowlists]]
  description = "Historical Stripe check passed the runtime secret variable to curl; no credential literal was committed."
  condition = "AND"
  regexTarget = "line"
  regexes = ['''curl -s -u "\$sk:"''']
  paths = ['''^scripts/go-live-check\.sh$''']
