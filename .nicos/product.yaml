description: >-
    Realtime social network with web, mobile, and desktop clients on a Convex
    backend. The product includes server-enforced audience rules, friendship and
    block graphs, groups, albums, stories, events, reactions, comments,
    notifications, direct messages, search, billing controls, and media. The
    production contract adds bounded indexed reads, resumable migrations,
    upload grants and quotas, signed media, durable provider delivery, health
    and readiness checks, telemetry, backup and restore tools, recovery targets,
    exact-origin web and desktop policies, and capacity profiles. Local proof
    passes 125 tests, live API checks, browser flows, native builds, a disposable
    restore, and synthetic HTTP load smoke tests. The product is built and
    locally publish-ready. It is not a deployed service, a public launch, an
    adoption claim, or a hosted scale certification.
