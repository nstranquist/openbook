[package]
name = "openbook-desktop"
version = "0.1.0"
description = "Openbook native desktop shell over the Convex web client"
authors = ["Nico Stranquist"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
