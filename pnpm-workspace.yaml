# The convex/ backend lives at the repo root (deployed by the Convex CLI).
# Every client app and the shared package are workspace members so they all
# resolve the same @openbook/shared source and the same generated API.
packages:
  - "apps/web"
  - "packages/*"
allowBuilds:
  esbuild: true
  workerd: true
# Security floors for transitive dependencies whose parents still pin
# vulnerable ranges (wrangler>miniflare, vite>postcss, concurrently).
overrides:
  undici: "^7.30.1"
  sharp: "^0.35.5"
  source-map-js: "^1.2.2"
  shell-quote: "^1.12.0"
